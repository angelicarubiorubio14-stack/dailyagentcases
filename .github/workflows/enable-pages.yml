name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode binary assets if needed
        run: |
          python3 << 'PY'
          import base64, json
          from pathlib import Path
          man_path = Path("_binaries_b64/MANIFEST.json")
          if not man_path.exists():
              print("no manifest")
              raise SystemExit(0)
          man = json.loads(man_path.read_text())
          for item in man:
              dest = Path(item["path"])
              data = base64.b64decode(Path("_binaries_b64", item["b64"]).read_text())
              if not dest.exists() or dest.read_bytes() != data:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(data)
                  print("wrote", dest, len(data))
              else:
                  print("ok", dest)
          PY

      - uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p /tmp/pages-artifact
          rsync -a --exclude '.git' --exclude '.github' --exclude '_binaries_b64' ./ /tmp/pages-artifact/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
